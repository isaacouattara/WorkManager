spring:
  application:
    name: workmanager-api

  config:
    # Charge le fichier .env (a la racine du projet) comme source de proprietes.
    # "optional:" evite une erreur si le fichier est absent.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  app:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: 60